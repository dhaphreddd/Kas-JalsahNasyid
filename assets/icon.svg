<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  <!-- Accent overlay -->
  <path d="M 128 384 Q 256 256 384 384 Z" fill="url(#grad2)" opacity="0.6" />
  <!-- Book / Chest Icon symbolizing Kas -->
  <g transform="translate(156, 120) scale(0.4)">
    <!-- Chest / Box -->
    <rect x="50" y="200" width="400" height="250" rx="30" fill="#ffffff" />
    <!-- Lid -->
    <path d="M 30 200 L 470 200 L 420 100 L 80 100 Z" fill="#f3f4f6" />
    <!-- Lock -->
    <rect x="225" y="220" width="50" height="70" rx="10" fill="#f59e0b" />
    <circle cx="250" cy="245" r="10" fill="#1f2937" />
    <!-- Music / Nasyid Note (floating) -->
    <path d="M 320 80 L 320 180 A 30 30 0 1 1 290 150 A 30 30 0 0 1 320 180 L 320 100 L 400 70 L 400 130 A 30 30 0 1 1 370 100 A 30 30 0 0 1 400 130 L 400 70 Z" fill="#34d399" />
  </g>
  <!-- App text -->
  <text x="256" y="450" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="bold" font-size="42" text-anchor="middle">KAS JALSAH</text>
</svg>
